name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            cc: gcc
          - name: macos-x64
            os: macos-15-intel
            cc: clang
          - name: macos-arm64
            os: macos-15
            cc: clang
          - name: windows-x64
            os: windows-latest
            cc: ""
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install numpy
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            make
            mingw-w64-x86_64-binutils
      - name: Test on Unix
        if: runner.os != 'Windows'
        run: make CC=${{ matrix.cc }} test
      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          PYTHON_BIN="$(cygpath -u "$pythonLocation/python.exe")"
          make PYTHON="$PYTHON_BIN" test

  workbench:
    name: Rust workbench
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install numpy
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        working-directory: ui/rust
        run: cargo fmt --check
      - name: Lint
        working-directory: ui/rust
        run: cmd /c build.bat clippy --all-targets -- -D warnings
      - name: Test
        working-directory: ui/rust
        run: cmd /c build.bat test

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install numpy
      - name: Read version
        run: |
          VERSION=$(sed -n 's/^#define IPA2VEC_VERSION "\(.*\)"/\1/p' src/ipa2vec_core.h)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Test
        run: make test
      - name: Package
        run: |
          mkdir -p release
          tar -czf "release/vec4ipa-cli-${VERSION}-linux-x64.tar.gz" \
            ipa2vec vec2ipa vec4ipa README.md LICENSE
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-linux-x64
          path: release/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS CLI (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install numpy
      - name: Read version
        run: |
          VERSION=$(sed -n 's/^#define IPA2VEC_VERSION "\(.*\)"/\1/p' src/ipa2vec_core.h)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Test
        run: make CC=clang test
      - name: Package
        run: |
          mkdir -p release
          tar -czf "release/vec4ipa-cli-${VERSION}-macos-${{ matrix.arch }}.tar.gz" \
            ipa2vec vec2ipa vec4ipa README.md LICENSE
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows CLI and workbench
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install numpy
      - name: Set up MSYS2
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            make
            mingw-w64-x86_64-binutils
      - name: Read version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^#define IPA2VEC_VERSION "\(.*\)"/\1/p' src/ipa2vec_core.h)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Test
        shell: msys2 {0}
        run: |
          PYTHON_BIN="$(cygpath -u "$pythonLocation/python.exe")"
          make PYTHON="$PYTHON_BIN" test
      - name: Package CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path ipa2vec.exe,vec2ipa.exe,vec4ipa.exe,README.md,LICENSE `
            -DestinationPath "release/vec4ipa-cli-$env:VERSION-windows-x64.zip" -Force
      - name: Build workbench
        shell: cmd
        run: ui\rust\package.bat
      - name: Install Inno Setup
        id: inno
        continue-on-error: true
        shell: pwsh
        run: choco install innosetup --version=6.7.3 -y --no-progress --requirechecksums
      - name: Build installer
        if: steps.inno.outcome == 'success'
        shell: cmd
        run: ui\rust\installer.bat
      - name: Copy installer
        if: steps.inno.outcome == 'success'
        shell: pwsh
        run: Copy-Item "ui\rust\installer\vec4ipa-setup-$env:VERSION.exe" "release\"
      - name: Package portable workbench
        shell: pwsh
        run: |
          Compress-Archive -Path ui\rust\dist\* `
            -DestinationPath "release/vec4ipa-workbench-$env:VERSION-windows-x64.zip" -Force
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-assets
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: assets
          merge-multiple: true
      - name: Check version
        run: |
          VERSION=$(sed -n 's/^#define IPA2VEC_VERSION "\(.*\)"/\1/p' src/ipa2vec_core.h)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match IPA2VEC_VERSION $VERSION"
            exit 1
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* \
              --title "vec4ipa ${TAG#v}" --generate-notes
          fi

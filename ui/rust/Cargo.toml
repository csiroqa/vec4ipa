[package]
name = "vec4ipa-ui"
version = "4.0.0"
edition = "2024"
build = "build.rs"
publish = false

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-reactor = "0.100"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1"
embed-resource = "3"
windows-reactor-setup = "0.100"
